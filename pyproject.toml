[project]
name = "latest-openshift"
version = "0.1.0"
description = "Query mirror.openshift.com for OpenShift releases and manage versioned OpenShift client tools"
readme = "README.md"
authors = [
    { name = "Daniel Fox", email = "danudey@me.com" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.scripts]
latest-openshift = "latest_openshift.cli:run"
ocp = "latest_openshift.cli:run"
openshift-shim = "latest_openshift.shim:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["latest_openshift", "fake_mirror"]

[tool.ruff.lint.per-file-ignores]
# Nested 'with' blocks in tests keep the assertion and the thing being
# asserted about visibly adjacent.
"tests/*" = ["SIM117"]
